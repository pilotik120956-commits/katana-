<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8a8a8a"/>
    </linearGradient>
    <linearGradient id="handle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b0000"/>
      <stop offset="100%" stop-color="#3a0000"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="#0a0a0a"/>
  <!-- sakura petals -->
  <g fill="#ffb7c5" opacity="0.6">
    <ellipse cx="30" cy="40" rx="6" ry="3" transform="rotate(20 30 40)"/>
    <ellipse cx="170" cy="60" rx="5" ry="2.5" transform="rotate(-30 170 60)"/>
    <ellipse cx="50" cy="170" rx="4" ry="2" transform="rotate(45 50 170)"/>
  </g>
  <!-- katana blade -->
  <g transform="translate(100,100) rotate(-45)">
    <rect x="-6" y="-70" width="12" height="110" fill="url(#blade)" rx="2"/>
    <polygon points="-6,-70 6,-70 0,-85" fill="#e8e8e8"/>
    <rect x="-8" y="40" width="16" height="6" fill="#d4af37" rx="1"/>
    <rect x="-7" y="46" width="14" height="28" fill="url(#handle)" rx="2"/>
    <rect x="-9" y="74" width="18" height="4" fill="#d4af37" rx="1"/>
  </g>
  <text x="100" y="175" text-anchor="middle" font-family="serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="4">KATANA</text>
  <text x="100" y="192" text-anchor="middle" font-family="serif" font-size="9" fill="#d4af37" letter-spacing="2">SUSHI BAR</text>
</svg>